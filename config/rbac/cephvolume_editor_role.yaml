# This rule is not used by the project cephbridge itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the storage.infra.net.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cephbridge
    app.kubernetes.io/managed-by: kustomize
  name: cephvolume-editor-role
rules:
- apiGroups:
  - storage.infra.net
  resources:
  - cephvolumes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - storage.infra.net
  resources:
  - cephvolumes/status
  verbs:
  - get
